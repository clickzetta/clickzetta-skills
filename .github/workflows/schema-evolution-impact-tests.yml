name: clickzetta-schema-evolution-impact offline tests

# Pure standard-library checks. No database, credentials, or model calls.
on:
  push:
    paths:
      - 'clickzetta-schema-evolution-impact/**'
      - '.github/workflows/schema-evolution-impact-tests.yml'
      - '.well-known/skills/index.json'
      - 'README.md'
  pull_request:
    paths:
      - 'clickzetta-schema-evolution-impact/**'
      - '.github/workflows/schema-evolution-impact-tests.yml'
      - '.well-known/skills/index.json'
      - 'README.md'
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Helper, package, and corpus integrity checks
        run: python -m unittest discover -s clickzetta-schema-evolution-impact/scripts/tests -v
