name: singsight-operate offline tests

# Pure standard-library checks against a local fake server. No credentials or network access.
on:
  push:
    paths:
      - 'singsight-operate/**'
      - '.github/workflows/singsight-operate-tests.yml'
  pull_request:
    paths:
      - 'singsight-operate/**'
      - '.github/workflows/singsight-operate-tests.yml'
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The script needs tomllib (Python 3.11+).
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: CLI, validation, and Open API client tests
        run: python -m unittest discover -s singsight-operate/scripts/tests -v
