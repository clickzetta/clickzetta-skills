name: SingSight Codex mapping
on:
  pull_request:
    paths:
      - 'singsight-install/**'
      - 'lakehouse-doc-en/references/singsight/**'
      - 'scripts/update-index.py'
      - '.well-known/skills/index.json'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/singsight-codex-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r singsight-install/scripts/codex/requirements.txt
      - run: python -m unittest discover -s singsight-install/tests -v
